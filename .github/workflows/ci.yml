
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify test environment file
        run: |
          test -f .env.test || {
            echo "Erreur : .env.test absent du dépôt"
            exit 1
          }

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Debug Python environment
        run: |
          uv run python --version
          uv run pytest --version
          uv run python -c "import sqlalchemy, pydantic_settings; print('SQLAlchemy:', sqlalchemy.__version__); print('pydantic-settings:', pydantic_settings.__version__)"
     

      - name: Run tests
        run: uv run pytest --cov=sentinel --cov-report=term-missing

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy sentinel

      - name: Pyright
        run: uv run pyright sentinel
