[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel"
version = "1.0.0"
description = "Internal Vulnerability Scanner"
readme = "README.md"
authors = [
  {name = "Saïd MAKOUR", email = "s.makour@gmail.com"},
]
requires-python = ">=3.13"

dependencies = [
    "ast_serialize==0.8.0",
    "certifi==2026.7.22",
    "charset-normalizer==3.5.1",
    "click==8.4.2",
    "colorama==0.4.6",
    "fastapi==0.141.1",
    "gitdb==4.0.12",
    "GitPython==3.1.60",
    "greenlet==3.5.5",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "httpx2==2.12.0",
    "idna==3.18",
    "iniconfig==2.3.0",
    "Jinja2==3.1.6",
    "librt==0.15.0",
    "Mako==1.4.1",
    "markdown-it-py==4.2.0",
    "MarkupSafe==3.0.3",
    "mdurl==0.1.2",
    "packaging==26.3",
    "pathspec==1.1.1",
    # "pip-review==1.3.0",
    "pluggy==1.6.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "pydantic_core==2.46.4",
    "Pygments==2.20.0",
    "python-dotenv==1.2.3",
    "PyYAML==6.0.3",
    "requests==2.34.2",
    "rich==15.0.0",
    "semantic-version==2.10.0",
    "shellingham==1.5.4",
    "smmap==5.0.3",
    "SQLAlchemy==2.0.52",
    "starlette==1.6.0",
    "stevedore==5.9.1",
    "typer==0.27.1",
    "types-PyYAML==6.0.12.20260815",
    "typing-inspection==0.4.4",
    "typing_extensions==4.16.0",
    "unicorn==2.1.4",
    "urllib3==2.7.0",
    "uvicorn==0.52.3",
    "psycopg[binary]>=3.2",
    "argon2-cffi>=25.1.0",
    "pyjwt>=2.13.0",
]

[project.optional-dependencies]
dev = [
    "coverage==7.15.4",
    "mypy==2.3.1",
    "mypy_extensions==1.1.0",
    "pyright==1.1.414",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.15.20",
]

[tool.setuptools.packages.find]
include = ["sentinel*"]

[project.scripts]
sentinel = "sentinel.main:main"

# ================ mypy ==========================
[tool.mypy]
python_version = "3.13"
explicit_package_bases = true
mypy_path = "."
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = false
warn_unused_ignores = true
warn_unreachable = true
strict_optional = true

disallow_untyped_defs = false
check_untyped_defs = true

plugins = ["sqlalchemy.ext.mypy.plugin"]



# ================ Ruff ==========================

[tool.ruff]
line-length = 79
target-version = "py313"
exclude = [
    ".venv",
    "venv",
    "logs",
    "database",
    "__pycache__",
    "sentinel.egg-info",
    "build",
    "migrations",
    "workspace",
]

[tool.ruff.lint]
select = [
    # PEP8 pycodestyle
    "E",
    "W",
    # erreurs Python
    "F",
    # imports
    "I",
    # bug patterns
    "B",
    # modernisation Python
    "UP",
    # conventions
    "N",
]

ignore = ["E501", "F821"]

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["sentinel"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# ================ bandit ==========================

[tool.bandit]
exclude_dirs = [
    'tests',
    "sentinel.egg-info",
    "workspace",
    "cache",
    "database",
    "export",
    "reports",
    "logs",
    "migrations",
]
skips = ["B404", "B603"]

# ================ pytest ==========================

[tool.pytest.ini_options]

filterwarnings = [
    "ignore:The anyio\\.abc\\.BlockingPortal alias is deprecated:DeprecationWarning:starlette",
]
testpaths = ["tests"]

addopts = []

[tool.coverage.run]
source = ["sentinel"]

omit = [
    "*/__init__.py",
    "sentinel/database/models.py",
]
# ================ pyright ==========================

[tool.pyright]
# Version Python cible
pythonVersion = "3.13"

# Environnement virtuel
venvPath = "."
venv = ".venv"

# Analyse du code
typeCheckingMode = "strict"

# Dossiers analysés
include = ["sentinel"]

# Dossiers ignorés
exclude = ["**/__pycache__", "**/.venv", "**/migrations", "**/.git", "OLD/**", "migrations/**",]

# Imports
reportMissingImports = true
reportMissingTypeStubs = false

# Typage strict
reportUnknownMemberType = "warning"
reportUnknownArgumentType = "warning"
reportUnknownVariableType = "warning"
reportUnknownParameterType = "warning"

# Fonctions
reportUntypedFunctionDecorator = "warning"
#reportUntypedFunctionCall = "warning"
reportMissingParameterType = "error"
reportMissingTypeArgument = "error"

# Retour des fonctions
#reportMissingReturnType = "error"
reportIncompatibleMethodOverride = "error"

# Classes
reportPrivateUsage = "warning"
reportUnusedClass = "warning"

# Variables
reportUnusedImport = "error"
reportUnusedVariable = "warning"

# Optional / None safety
reportOptionalMemberAccess = "error"
reportOptionalSubscript = "error"
reportOptionalCall = "error"
reportOptionalIterable = "error"
reportOptionalContextManager = "error"

# Exceptions
reportInvalidTypeForm = "error"

# Génériques
reportUnknownLambdaType = "warning"
reportInvalidTypeVarUse = "error"

# Dataclasses / Pydantic / SQLAlchemy
useLibraryCodeForTypes = true

# Compatibilité
stubPath = ""

# ========== Sonar ========================

[tool.sonar]
# must be unique in a given SonarQube instance
projectKey = "sentinel"

# --- optional properties ---
# defaults to project key
projectName = "sentinel"

# defaults to 'not provided'
projectVersion = "1.0.0"

# Path is relative to the pyproject.toml file. Defaults to .
sources = "./sentinel"

# python version
python.version = "3.13"

# coverage
python.coverage.reportPaths = "coverage.xml"

# exclude dirs
exclusions = [".venv", "OLD", "build", "sentinel.egg-info", "migrations"]

# Encoding of the source code. Default is default system encoding
sourceEncoding = "UTF-8"
